name: Windows protocol build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - uses: dtolnay/rust-toolchain@stable

    - name: Build protocol library and CLI
      run: cargo build --locked --release -p fastboot --lib --bin fastboot

    - name: Prepare command names
      shell: pwsh
      run: |
        Copy-Item -LiteralPath target/release/fastboot.exe -Destination target/release/adb.exe
        Copy-Item -LiteralPath target/release/fastboot.exe -Destination target/release/rmf-cli.exe
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: adb-fastboot-windows
        if-no-files-found: error
        path: |
          target/release/fastboot.exe
          target/release/adb.exe
          target/release/rmf-cli.exe
