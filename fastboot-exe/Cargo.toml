[package]
# 项目内 ADB/Fastboot 协议栈（源自上游 fastboot-rs，保留原作者归属与 BSD-3-Clause 许可证），
# 协议修复直接在本仓库维护。只支持 Windows（WinUSB），见 src/lib.rs。
name = "fastboot"
version = "2.0.0"
edition = "2021"
publish = false
authors = ["GriefRedd", "AndyWu"]
description = "Android ADB/Fastboot protocol stack over WinUSB (Windows only)"
license = "BSD-3-Clause"
repository = "https://github.com/wumai2580/fastboot-rs"
homepage = "https://github.com/wumai2580/fastboot-rs"

[[bin]]
name = "fastboot"
path = "src/main.rs"

[lib]
name = "fastboot"
# 只产 rlib：消费方（rm-flash-logic / rmf-app）都是进程内直接链接 `fastboot::embed`，
# 没有任何一处加载 fastboot.dll。供 C# P/Invoke 的 cdylib 随 C# 版一并弃用，
# 与 rm-flash-logic 同源；继续产 cdylib 只会和同名 bin 争 fastboot.pdb（cargo#6313，
# 该冲突将来会变成硬错误）。
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
zip = "0.6"
indicatif = "0.17"
byteorder = "1.5"
rsa = "0.9"
rand = "0.8"
base64 = "0.21"
dirs = "5.0"
num-bigint = "0.4"
walkdir = "2.4"
memmap2 = "0.9"
parking_lot = "0.12"
tempfile = "3.10"
zstd = "0.11"

[dev-dependencies]
proptest = "1.4"

[target.'cfg(windows)'.dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Devices_Usb",
    "Win32_Devices_DeviceAndDriverInstallation",
]

[target.'cfg(windows)'.dependencies.winapi]
version = "0.3"
features = [
    "setupapi",
    "handleapi",
    "fileapi",
    "winnt",
    "minwindef",
    "guiddef",
    "winerror",
    "winbase",
    "ioapiset",
    "winusbio",
    "errhandlingapi",
    "synchapi",
    "winusb",
    "sysinfoapi",
    "minwinbase",
    "namedpipeapi",
    "processthreadsapi",
]

[build-dependencies]
winres = "0.1"
